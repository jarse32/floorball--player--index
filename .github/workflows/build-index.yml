name: Build Player Index

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 03:00 UTC
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Erwartete Laufzeit nach dem Ratelimit-Fix: ~45-50 Minuten (2460 Ligen
    # x ~1.1s sequenzielle Scorer-Fetches, siehe build_index.py). Ohne
    # explizites Limit greift der GitHub-Actions-Default von 360 Minuten -
    # 90 Minuten als Sicherheitsnetz, damit ein haengender Lauf (z.B. eine
    # Liga, die dauerhaft in der Ratelimit-Wartezyklen-Schleife haengt)
    # nicht bis zu 6 Stunden Actions-Minuten verbraucht, aber mit klarem
    # Puffer ueber der erwarteten Laufzeit.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install aiohttp

      - name: Build player index
        env:
          SAISONMANAGER_API_KEY: ${{ secrets.SAISONMANAGER_API_KEY }}
        run: python scripts/build_index.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/player-index.json
          git diff --staged --quiet || git commit -m "Update player index $(date -u +%Y-%m-%d)"
          git push
